name: Archive cleanup

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Minimum tip commit age in days
        type: number
        default: 30
      dry_run:
        description: List branches without deleting
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: archive-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DAYS: ${{ inputs.days != null && inputs.days || 30 }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      PROTECTED: ${{ vars.CLEANUP_PROTECTED || '' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete stale archive branches
        run: |
          set -euo pipefail
          if ! [[ "$DAYS" =~ ^[0-9]+$ ]]; then
            echo "DAYS must be a non-negative integer" >&2
            exit 1
          fi
          cutoff=$(date -u -d "-$DAYS days" +%s)
          open_pr_heads=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --paginate --jq '.[].head.ref' || true)

          git for-each-ref \
            --format='%(refname:short) %(committerdate:unix)' \
            refs/remotes/origin |
          while read -r ref stamp; do
            branch=${ref#origin/}
            [ "$branch" = HEAD ] && continue
            [ "$branch" = "$DEFAULT_BRANCH" ] && continue
            [ "$stamp" -lt "$cutoff" ] || continue

            case ",$PROTECTED," in
              *,"$branch",*) continue ;;
            esac
            if printf '%s\n' "$open_pr_heads" | grep -Fxq -- "$branch"; then
              continue
            fi
            case "$branch" in
              *'#'*|*'%'*) echo "skip unsafe name: $branch"; continue ;;
            esac

            if [ "$DRY_RUN" = true ]; then
              echo "would delete $branch"
              continue
            fi

            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"; then
              echo "deleted $branch"
            else
              echo "skip $branch (delete failed)"
            fi
          done
