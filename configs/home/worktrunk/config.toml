# A worktree starts from a commit, so a file git ignores is missing there, and
# `post-start` copies the ones every checkout needs: without .envrc direnv never
# loads, and without .pi/settings.json pi loses the project's packages
# (pi-worktrunk, for one). Both work in every repository, so neither asks a
# repository to opt in. The hook bodies are TOML literal strings, so their
# double quotes and `$` need no escaping. Only the hook itself may quote a
# template variable: worktrunk shell-escapes the path it substitutes.

skip-shell-integration-prompt = true

[merge]
commit = false    # --no-commit by default

[post-start]
copy-envrc = "test -f {{ primary_worktree_path }}/.envrc && cp {{ primary_worktree_path }}/.envrc {{ worktree_path }}/.envrc"
copy-pi-settings = '''
  set -eu
  source={{ primary_worktree_path }}/.pi/settings.json
  target={{ worktree_path }}/.pi/settings.json
  if [ -f "$source" ] && [ ! -e "$target" ]; then
    mkdir -p "$(dirname "$target")"
    cp "$source" "$target"
  fi
'''

# Runs only after Worktrunk has completed the removal: the removed worktree's
# path is known and the store is untouched when the removal is cancelled or
# fails. The helper deletes only that worktree's key, so the primary checkout
# and its sibling worktrees stay trusted. It fails without writing when the
# trust store cannot be locked or parsed.
[post-remove]
cleanup-pi-trust = "pi-trust-cleanup {{ worktree_path }}"
