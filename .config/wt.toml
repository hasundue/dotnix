# Worktrunk configuration for this repository.
#
# A live tree can point into a worktree (`nix run .#home-live`), and removing
# that worktree would leave `~/dotnix.live.*` dangling until the next
# activation. `pre-remove` blocks, so this runs before the directory goes away
# and a failure stops the removal. Relinking is enough: a live target is a path
# inside a checkout, and every checkout carries the same path. The link is left
# alone, with a warning, when the primary checkout lacks that path, so a merge
# is never blocked by it. Project commands need one approval on first use.

[pre-remove]
rehome-live = '''
set -eu
worktree="{{ worktree_path }}"
primary="{{ primary_worktree_path }}"
for link in "$HOME"/dotnix.live.*; do
  [ -L "$link" ] || continue
  target="$(readlink "$link")"
  case "$target" in
    "$worktree" | "$worktree"/*) ;;
    *) continue ;;
  esac
  relative="${target#"$worktree"}"
  relative="${relative#/}"
  if [ ! -d "$primary/$relative" ]; then
    echo "warning: $link points into this worktree, but $primary/$relative is missing; leaving it for the next activation." >&2
    continue
  fi
  ln --force --no-target-directory --symbolic "$primary/$relative" "$link"
  echo "$(basename "$link") -> $primary/$relative (rehomed from the worktree being removed)"
done
'''
