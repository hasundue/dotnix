[[pre-start]]
verify-primary-synced = '''
set -eu
primary="{{ primary_worktree_path }}"
git -C "$primary" fetch origin
test "$(git -C "$primary" rev-parse --abbrev-ref HEAD)" = main
set -- $(git -C "$primary" rev-list --left-right --count origin/main...HEAD)
test "$1" = 0 && test "$2" = 0
'''

[[pre-start]]
setup-worktree = '''
set -eu
test -f .envrc || cp "{{ primary_worktree_path }}/.envrc" .
direnv allow
nix develop --command true
'''
